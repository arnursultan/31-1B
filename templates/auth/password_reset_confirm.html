{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="card">
    <h2>Установить новый пароль</h2>

    {% if success %}
        <p style="color:#2e7d32; margin-bottom:15px;">
            Пароль успешно обновлён.
        </p>
    {% else %}
        <form method="post">
            {% csrf_token %}

            <input
                type="password"
                name="password"
                placeholder="Новый пароль"
                required
                style="color:#000;"
            >

            <button type="submit">
                Сменить пароль
            </button>
        </form>
    {% endif %}
</div>
{% endblock %}
