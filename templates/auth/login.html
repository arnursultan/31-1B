{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="bg-slate-800 rounded-xl p-8 shadow-xl">
    <h2 class="text-2xl font-bold mb-6">? Login</h2>

    <a href="/auth/login/google-oauth2/"
       class="block w-full text-center bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg mb-4">
        Войдите в систему с помощью Google
    </a>

    <a href="/auth/login/github/"
       class="block w-full text-center bg-gray-700 hover:bg-gray-800 text-white py-3 rounded-lg mb-4">
        Войдите в систему с помощью GitHub
    </a>

    <a href="/auth/password/reset/"
       class="text-sm text-sky-400 hover:underline">

    </a>

{% endblock %}
